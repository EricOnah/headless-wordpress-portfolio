<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">WordPress and Next.js build</title>
  <desc id="desc">Illustration showing WordPress and Next.js working together</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#0b1221" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#67e8f9" stop-opacity="0.4" />
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="blur" />
      <feOffset in="blur" dx="0" dy="0" result="offset" />
      <feComponentTransfer in="offset">
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)" />
  <circle cx="600" cy="400" r="340" fill="url(#glow)" opacity="0.18" />
  <rect x="180" y="180" width="840" height="440" rx="38" fill="#0f172a" stroke="#1f2937" stroke-width="2" filter="url(#shadow)" />
  <rect x="210" y="210" width="780" height="380" rx="28" fill="#0b1221" stroke="#111827" stroke-width="2" />
  <g transform="translate(260 270)">
    <circle cx="140" cy="120" r="110" fill="#111827" stroke="#1f2937" stroke-width="3" />
    <circle cx="140" cy="120" r="104" fill="none" stroke="#10b981" stroke-width="5" />
    <text x="140" y="140" text-anchor="middle" font-family="Georgia, serif" font-size="86" fill="#e2e8f0">W</text>
    <text x="140" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" letter-spacing="4" fill="#94a3b8">WORDPRESS</text>
  </g>
  <g transform="translate(640 270)">
    <rect x="0" y="0" width="260" height="220" rx="24" fill="#0f172a" stroke="#1f2937" stroke-width="3" />
    <text x="130" y="130" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="70" fill="#e5e7eb">NEXT</text>
    <text x="180" y="170" font-family="Inter, Arial, sans-serif" font-size="26" fill="#10b981">JS</text>
    <text x="130" y="200" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="3" fill="#94a3b8">REACT FRONTEND</text>
  </g>
  <path id="wire1" d="M400 390 C500 420 540 430 600 360 C660 290 760 260 840 300" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
  <path id="wire2" d="M400 430 C500 460 560 460 630 410 C700 360 770 340 840 360" fill="none" stroke="#67e8f9" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.7" />

  <circle r="10" fill="#10b981">
    <animateMotion dur="5s" repeatCount="indefinite" rotate="auto">
      <mpath href="#wire1" />
    </animateMotion>
  </circle>
  <circle r="8" fill="#67e8f9">
    <animateMotion dur="4.5s" repeatCount="indefinite" rotate="auto" begin="-1s">
      <mpath href="#wire2" />
    </animateMotion>
  </circle>

  <circle cx="400" cy="390" r="10" fill="#10b981" opacity="0.4" />
  <circle cx="600" cy="360" r="10" fill="#10b981" opacity="0.4" />
  <circle cx="840" cy="300" r="10" fill="#10b981" opacity="0.4" />
  <circle cx="400" cy="430" r="8" fill="#67e8f9" opacity="0.4" />
  <circle cx="630" cy="410" r="8" fill="#67e8f9" opacity="0.4" />
  <circle cx="840" cy="360" r="8" fill="#67e8f9" opacity="0.4" />
  <text x="600" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" fill="#cbd5e1" letter-spacing="3">WORDPRESS + NEXT.JS BUILDS</text>
</svg>
